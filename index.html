<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reactor Core — Kraken Elite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  /* =====================================================================
     RÉGLAGES
     ===================================================================== */
  var CONFIG = {
    liquidRange: [30, 50],   // °C : cœur presque vide -> presque plein
    liquidAlert: 50,         // au-delà, la surface du liquide pulse en rouge
    cpuRange: [50, 89],      // arc gauche (continu, tête ronde) — 7800X3D : ~60-70 °C en usage léger, ~80 °C en jeu
    gpuRange: [30, 85],      // arc droit (segmenté, tête en losange)
    cpuAlert: 85,
    gpuAlert: 85,
    gpuMaxPower: 220,        // W, pour doser les étincelles (RX 9070)
    gpuIdlePower: 60,        // W : en dessous, l'eau est calme
    // L'agitation de l'eau (vagues, bulles, gouttelettes) suit la consommation du GPU
    defaultFps: 30
  };

  // Teinte unique : blanc glacier #a0e7ff, avec un léger écart entre les deux jauges
  var GLACIER = { h: 195, w: 1.00 };
  var CPU_TINT = { h: 203, w: 0.70 };   // un peu plus bleuté
  var GPU_TINT = { h: 186, w: 1.00 };   // un peu plus blanc/cyan

  var href = location.href;
  var onKraken = /[?&]kraken=1/.test(href);
  var showFps = /fps=1/.test(href);

  /* =====================================================================
     DONNÉES CAM
     ===================================================================== */
  var state = { cpu: 45, gpu: 40, liq: 36, load: 0.1, gpuPower: 30, ram: 0.4, live: false };
  var calm  = { cpu: 45, gpu: 40, liq: 36, load: 0.1, gpuPower: 30, ram: 0.4 };
  var TAUS  = { cpu: 4, gpu: 3, liq: 2, load: 1.2, gpuPower: 1, ram: 2 };

  function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }
  function pickGpu(gpus) {
    if (!gpus || !gpus.length) return null;
    for (var i = 0; i < gpus.length; i++) {
      if (gpus[i] && /RX|RTX|GTX|Arc/i.test(gpus[i].name || "")) return gpus[i];
    }
    return gpus[gpus.length - 1];
  }
  function onData(d) {
    if (!d) return;
    var c = d.cpus && d.cpus[0], g = pickGpu(d.gpus), r = d.ram, k = d.kraken;
    if (c) {
      if (num(c.temperature) !== null) state.cpu = c.temperature;
      if (num(c.load) !== null) state.load = c.load > 1 ? c.load / 100 : c.load;
    }
    if (g) {
      if (num(g.temperature) !== null) state.gpu = g.temperature;
      if (num(g.power) !== null) state.gpuPower = g.power;
    }
    if (r && num(r.inUse) !== null && num(r.totalSize) && r.totalSize > 0) state.ram = r.inUse / r.totalSize;
    if (k && num(k.liquidTemperature) !== null) state.liq = k.liquidTemperature;
    state.live = true;
  }
  function attach() {
    if (!window.nzxt || typeof window.nzxt !== "object") window.nzxt = {};
    if (!window.nzxt.v1 || typeof window.nzxt.v1 !== "object") window.nzxt.v1 = {};
    if (window.nzxt.v1.onMonitoringDataUpdate !== onData) window.nzxt.v1.onMonitoringDataUpdate = onData;
  }
  attach();
  setInterval(attach, 1000);
  window.addEventListener("load", attach);

  /* =====================================================================
     OUTILS
     ===================================================================== */
  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(x) { return 1 - Math.pow(1 - clamp(x, 0, 1), 3); }
  function range01(v, r) { return clamp((v - r[0]) / (r[1] - r[0]), 0, 1); }
  function col(th, s, l, a) {
    l = l + (100 - l) * 0.52 * th.w * clamp((l - 15) / 40, 0, 1);
    return "hsla(" + th.h.toFixed(1) + "," + s + "%," + l.toFixed(1) + "%," + clamp(a, 0, 1).toFixed(3) + ")";
  }
  function red(l, a) { return "hsla(358,100%," + l + "%," + clamp(a, 0, 1).toFixed(3) + ")"; }

  /* =====================================================================
     CANVAS
     ===================================================================== */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var S = 640, R = 320, cx = 320, cy = 320, DPR = 1;
  function resize() {
    var v1 = window.nzxt.v1;
    var w = num(v1.width) || window.innerWidth, h = num(v1.height) || window.innerHeight;
    S = Math.max(100, Math.min(w, h, window.innerWidth, window.innerHeight));
    var dpr = onKraken ? 1 : (window.devicePixelRatio || 1);
    DPR = dpr;
    canvas.width = Math.round(S * dpr); canvas.height = Math.round(S * dpr);
    canvas.style.width = S + "px"; canvas.style.height = S + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = S / 2; cx = R; cy = R;
  }
  window.addEventListener("resize", resize);
  resize();

  var FONT = "Oxanium, Bahnschrift, 'Segoe UI', Arial, sans-serif";
  if (document.fonts && document.fonts.load) {
    document.fonts.load("400 100px Oxanium");
    document.fonts.load("700 100px Oxanium");
  }

  /* =====================================================================
     ÉTAT DE L'ANIMATION
     ===================================================================== */
  var t = 0, last = performance.now(), lastDraw = 0, startTime = performance.now();
  var boot = 0;
  var rotCells = 0, wave = 0, rotComets = 0, cometDir = 0;
  var fastLiq = null, slowLiq = null;
  var arcCpu = 0, arcGpu = 0;
  var peak = { cpu: 0, gpu: 0, holdCpu: 0, holdGpu: 0 };
  var ramLit = 0, level = 0;
  var bubbles = [], bubbleAcc = 0, pops = [], drops = [], dropAcc = 0;
  var agi = 0, ph1 = 0, ph2 = 0, ph3 = 0;   // agitation 0-1 et phases des vagues
  var fpsCount = 0, fpsShown = 0, fpsTime = performance.now();

  function updatePeak(key, holdKey, frac, dt) {
    if (frac >= peak[key]) { peak[key] = frac; peak[holdKey] = 1.8; }
    else if (peak[holdKey] > 0) peak[holdKey] -= dt;
    else peak[key] = Math.max(frac, peak[key] - 0.06 * dt);   // retombe doucement
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var fps = num(window.nzxt.v1.targetFps) || CONFIG.defaultFps;
    if (now - lastDraw < 1000 / fps - 2) return;
    lastDraw = now;
    var dt = Math.min(1, Math.max(0, (now - last) / 1000));
    last = now;
    t += dt;

    fpsCount++;
    if (now - fpsTime >= 1000) { fpsShown = Math.round(fpsCount * 1000 / (now - fpsTime)); fpsCount = 0; fpsTime = now; }

    if (!state.live && (!onKraken || now - startTime > 2000)) {
      state.load = clamp(0.35 + 0.3 * Math.sin(t / 3.1) * Math.sin(t / 7.3), 0, 1);
      state.cpu = 62 + 14 * Math.sin(t / 6);
      state.gpu = 55 + 22 * Math.sin(t / 8 + 1);
      state.liq = 39 + 6 * Math.sin(t / 12);
      state.gpuPower = 110 + 100 * Math.sin(t / 5);
      state.ram = 0.45 + 0.15 * Math.sin(t / 11);
    }

    for (var key in calm) calm[key] += (state[key] - calm[key]) * (1 - Math.exp(-dt / TAUS[key]));

    boot = Math.min(1, boot + dt / 1.8);
    var b = easeOut(boot);
    var load = calm.load;

    // Vitesses plafonnées selon les images/s (pas d'effet « roue de diligence »)
    rotCells += dt * Math.min(0.06 + load * 0.9, 0.25 * (TAU / 24) * fps);
    wave += dt * Math.min(1 + load * 3, 0.15 * TAU * fps / 6);

    if (fastLiq === null) { fastLiq = slowLiq = state.liq; }
    fastLiq += (state.liq - fastLiq) * (1 - Math.exp(-dt / 3));
    slowLiq += (state.liq - slowLiq) * (1 - Math.exp(-dt / 15));
    cometDir += (Math.tanh((fastLiq - slowLiq) / 0.25) - cometDir) * (1 - Math.exp(-dt / 1.2));
    rotComets += dt * cometDir * Math.min(0.5 + load * 1.6, 0.25 * (TAU / 3) * fps);

    var fc = range01(calm.cpu, CONFIG.cpuRange) * b, fg = range01(calm.gpu, CONFIG.gpuRange) * b;
    arcCpu += (fc - arcCpu) * (1 - Math.exp(-dt * 3));
    arcGpu += (fg - arcGpu) * (1 - Math.exp(-dt * 3));
    updatePeak("cpu", "holdCpu", arcCpu, dt);
    updatePeak("gpu", "holdGpu", arcGpu, dt);

    ramLit += (clamp(calm.ram, 0, 1) * 24 - ramLit) * (1 - Math.exp(-dt * 2));
    level += (lerp(0.08, 0.92, range01(calm.liq, CONFIG.liquidRange)) * b - level) * (1 - Math.exp(-dt * 1.5));

    // Agitation de l'eau = consommation GPU (montée ~2 s, retombée ~4 s, jamais brutale)
    var agiTarget = Math.pow(clamp((calm.gpuPower - CONFIG.gpuIdlePower) / (CONFIG.gpuMaxPower - CONFIG.gpuIdlePower), 0, 1), 0.9);
    agi += (agiTarget - agi) * (1 - Math.exp(-dt / (agiTarget > agi ? 2 : 4)));
    // phases intégrées : la vitesse des vagues change sans à-coups
    ph1 += dt * (1.2 + 2.6 * agi);
    ph2 += dt * (1.7 + 3.4 * agi);
    ph3 += dt * (2.5 + 5.0 * agi);

    // Bulles : rares au repos, nombreuses et plus grosses en pleine charge
    bubbleAcc += dt * (0.35 + 11 * Math.pow(agi, 1.5)) * b;
    while (bubbleAcc >= 1) {
      bubbleAcc -= 1;
      if (bubbles.length < 16) bubbles.push({
        x: (Math.random() * 2 - 1) * 0.45, y: 0.6,
        v: 0.07 + 0.08 * Math.random() + 0.22 * agi,
        r: (0.005 + 0.007 * Math.random()) * (1 + 1.3 * agi),
        ph: Math.random() * TAU, wob: 0.006 + 0.012 * agi
      });
    }
    for (var j = bubbles.length - 1; j >= 0; j--) {
      var bu = bubbles[j];
      bu.y -= bu.v * dt; bu.ph += dt * (3 + 4 * agi);
      if (bu.y < surfaceAt(bu.x) + bu.r) {                  // éclate à la surface : petite onde
        if (pops.length < 12) pops.push({ x: bu.x, life: 0, max: 0.45, r: bu.r });
        bubbles.splice(j, 1);
      }
    }
    for (var q = pops.length - 1; q >= 0; q--) { pops[q].life += dt; if (pops[q].life > pops[q].max) pops.splice(q, 1); }

    // Gouttelettes projetées : seulement quand ça bout vraiment
    dropAcc += dt * Math.max(0, agi - 0.65) * 18 * b;
    while (dropAcc >= 1) {
      dropAcc -= 1;
      if (drops.length < 10) {
        var dx0 = (Math.random() * 2 - 1) * 0.4;
        drops.push({ x: dx0, y: surfaceAt(dx0), vx: (Math.random() - 0.5) * 0.12, vy: -(0.22 + Math.random() * 0.2), r: 0.005 + Math.random() * 0.004 });
      }
    }
    for (var di = drops.length - 1; di >= 0; di--) {
      var dr = drops[di];
      dr.vy += 1.1 * dt; dr.x += dr.vx * dt; dr.y += dr.vy * dt;
      if (dr.vy > 0 && dr.y > surfaceAt(dr.x)) drops.splice(di, 1);
    }

    draw(load, b);
  }

  /* =====================================================================
     LIQUIDE : surface ondulée (en unités de R, relatives au centre)
     ===================================================================== */
  var RC = 0.625;   // rayon intérieur du cœur
  function surfaceAt(x) {   // x en unités de R (-RC..RC) -> y en unités de R
    var base = RC - level * 2 * RC;
    var a1 = 0.006 + 0.026 * agi, a2 = 0.004 + 0.018 * agi, a3 = 0.012 * agi * agi;   // vagues plus hautes et plus hachées quand ça chauffe
    return base + a1 * Math.sin(x * 9 + ph1) + a2 * Math.sin(x * 15 - ph2) + a3 * Math.sin(x * 31 + ph3);
  }
  function surfacePath(close) {
    ctx.beginPath();
    var steps = 40;
    for (var i = 0; i <= steps; i++) {
      var x = -RC + (2 * RC) * i / steps;
      var px = cx + x * R, py = cy + surfaceAt(x) * R;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    if (close) { ctx.lineTo(cx + RC * R, cy + R); ctx.lineTo(cx - RC * R, cy + R); ctx.closePath(); }
  }

  /* =====================================================================
     DESSIN
     ===================================================================== */
  function sector(r1, r2, a1, a2) {
    ctx.beginPath();
    ctx.arc(cx, cy, r2, a1, a2);
    ctx.arc(cx, cy, r1, a2, a1, true);
    ctx.closePath();
  }

  function draw(load, b) {
    var th = GLACIER;
    ctx.save();
    ctx.clearRect(0, 0, S, S);
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();

    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    bg.addColorStop(0, col(th, 60, 3, 1));
    bg.addColorStop(0.6, col(th, 50, 2.5, 1));
    bg.addColorStop(1, "#000");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, S, S);

    ctx.globalCompositeOperation = "lighter";
    drawCells(th);
    drawArcCpu(b);
    drawArcGpu(b);
    drawCore(th, load, b);
    drawComets(th, b);
    ctx.globalCompositeOperation = "source-over";

    drawLiquidAndTime(th, b);

    if (showFps) {
      ctx.font = "600 " + (R * 0.05) + "px " + FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillText(fpsShown + " i/s", cx, cy - R * 0.52);
    }
    if (!state.live) {
      ctx.font = "600 " + (R * 0.045) + "px " + FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(255,255,255," + (0.35 * b) + ")";
      ctx.fillText("DÉMO", cx, cy + R * 0.52);
    }
    ctx.restore();
  }

  // 1. Cellules = RAM utilisée
  function drawCells(th) {
    var NS = 24, gap = 0.04, r1 = R * 0.815, r2 = R * 0.985, lw = Math.max(2, R * 0.006);
    for (var j = 0; j < NS; j++) {
      var reveal = clamp(boot * (NS + 4) - j, 0, 1);
      if (reveal <= 0) continue;
      var s1 = rotCells + j * TAU / NS + gap / 2 - Math.PI / 2;
      var s2 = rotCells + (j + 1) * TAU / NS - gap / 2 - Math.PI / 2;
      var fill = clamp(ramLit - j, 0, 1);
      sector(r1, r2, s1, s2);
      ctx.fillStyle = col(th, 70, 40, 0.07 * reveal); ctx.fill();
      ctx.strokeStyle = col(th, 90, 60, 0.22 * reveal); ctx.lineWidth = lw; ctx.stroke();
      if (fill > 0) {
        var w = 0.5 + 0.5 * Math.sin(wave - j * TAU / NS * 2);
        var br = 0.45 + 0.55 * w * w;
        sector(r1 - R * 0.012, r2 + R * 0.012, s1 - 0.01, s2 + 0.01);
        ctx.fillStyle = col(th, 100, 60, 0.12 * br * fill * reveal); ctx.fill();
        sector(r1, r2, s1, s2);
        ctx.fillStyle = col(th, 100, lerp(38, 66, br), (0.35 + 0.6 * br) * fill * reveal); ctx.fill();
      }
    }
  }

  // Géométrie commune des deux jauges
  var RG = 0.715, GW = 0.05, GAPB = 0.22, GAPT = 0.12, SPAN = Math.PI - GAPB - GAPT;
  function angleOf(side, frac) { return Math.PI / 2 + side * (GAPB + SPAN * frac); }

  function drawTrackLines(th, side, b) {
    var a0 = angleOf(side, 0), a1 = angleOf(side, 1);
    var lo = Math.min(a0, a1), hi = Math.max(a0, a1), rg = R * RG, gw = R * GW;
    ctx.strokeStyle = col(th, 100, 70, 0.22 * b);
    ctx.lineWidth = Math.max(2, R * 0.005);
    ctx.beginPath(); ctx.arc(cx, cy, rg + gw * 0.72, lo, hi); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rg - gw * 0.72, lo, hi); ctx.stroke();
  }

  // 2a. CPU (gauche) : arc continu, tête ronde
  function drawArcCpu(b) {
    var th = CPU_TINT, side = +1, rg = R * RG, gw = R * GW, frac = arcCpu;
    var alert = calm.cpu >= CONFIG.cpuAlert;
    var a0 = angleOf(side, 0), aEnd = angleOf(side, frac), aFull = angleOf(side, 1), aPk = angleOf(side, peak.cpu);
    ctx.strokeStyle = col(th, 90, 60, 0.09 * b); ctx.lineWidth = gw;
    ctx.beginPath(); ctx.arc(cx, cy, rg, a0, aFull); ctx.stroke();
    drawTrackLines(th, side, b);

    // maximum récent qui retombe : prolongement translucide
    if (peak.cpu > frac + 0.004) {
      ctx.strokeStyle = col(th, 100, 70, 0.22 * b); ctx.lineWidth = gw * 0.8;
      ctx.beginPath(); ctx.arc(cx, cy, rg, aEnd, aPk); ctx.stroke();
    }
    if (frac > 0.003) {
      var spanFrac = (aEnd - a0) / TAU;
      var g = typeof ctx.createConicGradient === "function" ? ctx.createConicGradient(a0, cx, cy) : null;
      function grad(l1, l2, alpha) {
        if (!g) return col(th, 100, l2, alpha);
        var gg = ctx.createConicGradient(a0, cx, cy);
        gg.addColorStop(0, col(th, 100, l1, alpha * 0.8));
        gg.addColorStop(Math.max(spanFrac, 0.001), col(th, 100, l2, alpha));
        gg.addColorStop(Math.min(1, spanFrac + 0.002), col(th, 100, l2, 0));
        return gg;
      }
      ctx.strokeStyle = grad(45, 62, 0.18); ctx.lineWidth = gw * 2.2;
      ctx.beginPath(); ctx.arc(cx, cy, rg, a0, aEnd); ctx.stroke();
      ctx.strokeStyle = grad(48, 76, 0.95); ctx.lineWidth = gw;
      ctx.beginPath(); ctx.arc(cx, cy, rg, a0, aEnd); ctx.stroke();
      if (alert) {
        ctx.strokeStyle = red(55, 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 6))); ctx.lineWidth = gw * 1.1;
        ctx.beginPath(); ctx.arc(cx, cy, rg, a0, aEnd); ctx.stroke();
      }
      var hx = cx + Math.cos(aEnd) * rg, hy = cy + Math.sin(aEnd) * rg;
      ctx.shadowColor = alert ? red(60, 1) : col(th, 100, 65, 1);
      ctx.shadowBlur = R * 0.06;
      ctx.fillStyle = alert ? "hsla(0,100%,88%,1)" : col(th, 100, 90, 1);
      ctx.beginPath(); ctx.arc(hx, hy, gw * (alert ? 0.75 + 0.2 * Math.sin(t * 6) : 0.62), 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // 2b. GPU (droite) : arc segmenté en blocs, tête en losange
  function drawArcGpu(b) {
    var th = GPU_TINT, side = -1, rg = R * RG, gw = R * GW, frac = arcGpu;
    var alert = calm.gpu >= CONFIG.gpuAlert;
    var NB = 18, bgap = 0.018, lw = Math.max(2, R * 0.004);
    var pulse = 0.5 + 0.5 * Math.sin(t * 6);
    drawTrackLines(th, side, b);
    for (var k = 0; k < NB; k++) {
      var f0 = k / NB, f1 = (k + 1) / NB;
      var a1 = angleOf(side, f0) - side * bgap / 2, a2 = angleOf(side, f1) + side * bgap / 2;
      var lo = Math.min(a1, a2), hi = Math.max(a1, a2);
      var fill = clamp(frac * NB - k, 0, 1);
      var ghost = clamp(peak.gpu * NB - k, 0, 1) - fill;
      sector(rg - gw / 2, rg + gw / 2, lo, hi);
      ctx.strokeStyle = col(th, 90, 60, 0.20 * b); ctx.lineWidth = lw; ctx.stroke();
      if (fill > 0) {
        var rel = frac > 0 ? (k + 0.5) / (frac * NB) : 0;    // plus lumineux vers la tête
        sector(rg - gw, rg + gw, lo, hi);
        ctx.fillStyle = col(th, 100, 60, 0.10 * fill); ctx.fill();
        sector(rg - gw / 2, rg + gw / 2, lo, hi);
        ctx.fillStyle = alert ? red(lerp(45, 65, rel), (0.55 + 0.4 * pulse) * fill)
                              : col(th, 100, lerp(46, 76, clamp(rel, 0, 1)), 0.95 * fill);
        ctx.fill();
      } else if (ghost > 0.02) {
        sector(rg - gw / 2, rg + gw / 2, lo, hi);
        ctx.fillStyle = col(th, 100, 70, 0.22 * ghost * b); ctx.fill();
      }
    }
    if (frac > 0.003) {
      var aEnd = angleOf(side, frac);
      var hx = cx + Math.cos(aEnd) * rg, hy = cy + Math.sin(aEnd) * rg;
      var sz = gw * (alert ? 0.85 + 0.2 * Math.sin(t * 6) : 0.75);
      ctx.save();
      ctx.translate(hx, hy); ctx.rotate(aEnd + Math.PI / 4);
      ctx.shadowColor = alert ? red(60, 1) : col(th, 100, 65, 1);
      ctx.shadowBlur = R * 0.06;
      ctx.fillStyle = alert ? "hsla(0,100%,88%,1)" : col(th, 100, 90, 1);
      ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
      ctx.restore();
    }
  }

  // 3. Cœur sombre, halo sur le bord
  function drawCore(th, load, b) {
    var pulse = (0.5 + 0.5 * Math.sin(t * (1.5 + load * 3))) * b;
    var rc = R * 0.65;
    var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, rc);
    core.addColorStop(0, col(th, 100, 50, 0.02));
    core.addColorStop(0.75, col(th, 100, 50, 0.03 + 0.02 * pulse));
    core.addColorStop(0.94, col(th, 100, 60, 0.18 + 0.12 * pulse));
    core.addColorStop(1, col(th, 100, 60, 0));
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(cx, cy, rc, 0, TAU); ctx.fill();
    ctx.shadowColor = col(th, 100, 65, 1);
    ctx.shadowBlur = R * 0.05;
    ctx.strokeStyle = col(th, 100, 78, 0.85 * b);
    ctx.lineWidth = Math.max(2, R * 0.01);
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.635, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 4. Comètes : sens horaire = le liquide chauffe, antihoraire = il refroidit
  function drawComets(th, b) {
    var rk = R * 0.59;
    var tail = 0.15 + 0.85 * Math.abs(cometDir), sgn = cometDir >= 0 ? 1 : -1;
    for (var ci = 0; ci < 3; ci++) {
      var head = rotComets + ci * TAU / 3;
      for (var st = 0; st < 14; st++) {
        var f = st / 13, aa = head - sgn * tail * f;
        ctx.fillStyle = col(th, 100, lerp(92, 60, f), (1 - f) * 0.95 * b);
        ctx.beginPath();
        ctx.arc(cx + Math.cos(aa) * rk, cy + Math.sin(aa) * rk, Math.max(1.5, R * 0.018 * (1 - f * 0.75)), 0, TAU);
        ctx.fill();
      }
    }
  }

  // 6. Liquide (température) + heure, avec effet « vu à travers l'eau » sous la surface
  function timeStrings() {
    var d = new Date();
    return [String(d.getHours()).padStart(2, "0"), String(d.getMinutes()).padStart(2, "0")];
  }
  function drawTime(c, alpha, tint) {
    var hm = timeStrings(), size = R * 0.36;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.font = "400 " + size + "px " + FONT;
    c.fillStyle = tint ? col(GLACIER, 100, 80, alpha) : "rgba(255,255,255," + alpha + ")";
    c.fillText(hm[0], cx, cy - R * 0.17);
    c.font = "700 " + size + "px " + FONT;
    c.fillStyle = tint ? col(GLACIER, 100, 86, alpha) : "rgba(255,255,255," + alpha + ")";
    c.fillText(hm[1], cx, cy + R * 0.19);
  }

  // Heure « sous l'eau » : dessinée floutée dans une image à part, seulement quand elle change
  var under = document.createElement("canvas"), uctx = under.getContext("2d"), underKey = "";
  function fontReady() { return !!(document.fonts && document.fonts.check && document.fonts.check("700 20px Oxanium")); }
  function renderUnder() {
    var hm = timeStrings();
    var key = hm.join(":") + "|" + canvas.width + "|" + fontReady();
    if (key === underKey) return;
    underKey = key;
    under.width = canvas.width; under.height = canvas.height;
    uctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    uctx.clearRect(0, 0, S, S);
    if ("filter" in uctx) uctx.filter = "blur(" + (R * 0.006).toFixed(2) + "px)";
    drawTime(uctx, 1, true);
    uctx.filter = "none";
  }

  function drawLiquidAndTime(th, b) {
    var alertL = calm.liq >= CONFIG.liquidAlert;
    var pA = 0.5 + 0.5 * Math.sin(t * 6);
    var sY = cy + surfaceAt(0) * R;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, RC * R, 0, TAU); ctx.clip();

    // a. corps du liquide
    surfacePath(true);
    var lg = ctx.createLinearGradient(0, sY - R * 0.03, 0, cy + RC * R);
    lg.addColorStop(0, alertL ? red(55, 0.20 + 0.12 * pA) : col(th, 100, 62, 0.20 * b));
    lg.addColorStop(1, alertL ? red(35, 0.10) : col(th, 100, 45, 0.07 * b));
    ctx.fillStyle = lg;
    ctx.fill();

    // b. heure au-dessus de la surface : nette
    ctx.save();
    surfacePath(false);
    ctx.lineTo(cx + RC * R, cy - R); ctx.lineTo(cx - RC * R, cy - R); ctx.closePath();
    ctx.clip();
    ctx.shadowColor = col(th, 100, 50, 0.9); ctx.shadowBlur = R * 0.05;
    drawTime(ctx, b, false);
    ctx.restore();

    // c. heure sous la surface : floutée et légèrement ondulée, comme vue à travers l'eau
    renderUnder();
    ctx.save();
    surfacePath(true);
    ctx.clip();
    ctx.setTransform(1, 0, 0, 1, 0, 0);          // on travaille en pixels réels
    ctx.globalAlpha = 0.8 * b;
    var top = Math.floor(Math.max(sY - R * 0.05, cy - R * 0.42) * DPR);
    var bottom = Math.ceil((cy + R * 0.42) * DPR);
    var band = Math.max(2, Math.round(2 * DPR));
    var W = under.width;
    for (var y = top; y < bottom; y += band) {
      var yc = y / DPR;
      var off = ((0.004 + 0.006 * agi) * R * Math.sin(yc * 0.045 + ph1 * 1.4) + (0.002 + 0.004 * agi) * R * Math.sin(yc * 0.11 - ph2 * 1.3)) * DPR;
      ctx.drawImage(under, 0, y, W, band, off, y, W, band);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // d. reflets de la surface et bulles
    ctx.globalCompositeOperation = "lighter";
    var bubLw = Math.max(1.5, R * 0.004);
    for (var i = 0; i < bubbles.length; i++) {
      var bu = bubbles[i];
      var bx = cx + (bu.x + bu.wob * Math.sin(bu.ph)) * R, by = cy + bu.y * R;
      ctx.strokeStyle = col(th, 100, 85, 0.5 * b);
      ctx.lineWidth = bubLw;
      ctx.beginPath(); ctx.arc(bx, by, bu.r * R, 0, TAU); ctx.stroke();
    }
    for (var pi = 0; pi < pops.length; pi++) {            // ondes laissées par les bulles qui éclatent
      var po = pops[pi], pf = po.life / po.max;
      var px = cx + po.x * R, py = cy + surfaceAt(po.x) * R;
      ctx.strokeStyle = col(th, 100, 88, 0.6 * (1 - pf) * b);
      ctx.lineWidth = bubLw;
      ctx.beginPath(); ctx.ellipse(px, py, (po.r + 0.03 * pf) * R, (po.r * 0.4 + 0.008 * pf) * R, 0, 0, TAU); ctx.stroke();
    }
    surfacePath(false);
    ctx.shadowColor = alertL ? red(60, 1) : col(th, 100, 65, 1);
    ctx.shadowBlur = R * 0.04;
    ctx.strokeStyle = alertL ? red(70, 0.6 + 0.4 * pA) : col(th, 100, 85, 0.75 * b);
    ctx.lineWidth = Math.max(2.5, R * 0.009);
    ctx.stroke();
    ctx.shadowBlur = 0;
    for (var dk = 0; dk < drops.length; dk++) {           // gouttelettes au-dessus de la surface
      var dd = drops[dk];
      ctx.fillStyle = alertL ? red(75, 0.8) : col(th, 100, 88, 0.8 * b);
      ctx.beginPath(); ctx.arc(cx + dd.x * R, cy + dd.y * R, Math.max(2, dd.r * R), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
