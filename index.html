<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reactor Core — Kraken Elite</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  /* ---------- Réglages faciles ---------- */
  var CONFIG = {
    // Couleur générale selon la température du LIQUIDE : [°C, position dans le dégradé 0-1]
    // 0 = blanc glacier, 0.5 = bleu, 0.75 = violet, 0.9 = magenta, 1 = rouge
    liquidScale: [
      [35, 0.00],   // jusqu'à 35 °C (ventilos 35 %) : blanc glacier
      [40, 0.55],   // 40 °C (ventilos 45 %) : bleu
      [45, 0.75],   // 45 °C (ventilos 60 %) : violet
      [50, 0.90],   // 50 °C (ventilos 85 %) : magenta
      [55, 1.00]    // 55 °C (ventilos 100 %) : rouge
    ],
    // Dégradé de couleur selon la température : [position 0-1, teinte, "blanchiment" 0-1]
    // 0 = blanc glacier #a0e7ff, puis bleu, violet, magenta, rouge
    palette: [
      [0.00, 195, 1.00],
      [0.30, 198, 0.60],
      [0.50, 215, 0.20],
      [0.68, 270, 0.00],
      [0.82, 330, 0.00],
      [0.92, 355, 0.00],
      [1.00, 360, 0.00]
    ],
    defaultFps: 30,
    cycleSeconds: 6,    // durée d'affichage de chaque valeur
    sparks: true        // étincelles qui jaillissent du cœur selon la charge CPU (false pour les retirer)
  };

  // Valeurs affichées tour à tour au centre (min/max = échelle de la jauge)
  var METRICS = [
    // trend = écart (°C) à partir duquel on considère que la valeur monte ou descend nettement
    { key: "cpu", label: "CPU",     unit: "°", min: 20, max: 90, trend: 1.5 },
    { key: "gpu", label: "GPU",     unit: "°", min: 20, max: 90, trend: 1.5 },
    { key: "liq", label: "LIQUIDE", unit: "°", min: 25, max: 55, trend: 0.25 }
    // Pour ajouter les charges : { key: "load",    label: "CPU", unit: "%", min: 0, max: 100 }
    //                            { key: "gpuLoad", label: "GPU", unit: "%", min: 0, max: 100 }
  ];

  var params = new URLSearchParams(location.search);
  var onKraken = params.get("kraken") === "1";

  /* ---------- Données ---------- */
  var state = { cpu: 35, gpu: 35, liq: 28, load: 0.1, gpuLoad: 0.1, live: false };
  var disp  = { cpu: 35, gpu: 35, liq: 28, load: 0.1, gpuLoad: 0.1 };
  var calm  = { cpu: 35, gpu: 35, liq: 28, load: 0.1, gpuLoad: 0.1 };   // valeurs lissées sur ~2,5 s pour le chiffre
  function metricValue(m, src) { return m.unit === "%" ? src[m.key] * 100 : src[m.key]; }

  // Animation de l'affichage central
  var anim = {
    idx: 0, prev: -1, since: 0,   // valeur affichée, précédente, temps écoulé
    shown: 0,                     // nombre du compteur à rouleaux (part de 0 au démarrage)
    gauge: 0,                     // remplissage de la jauge
    burst: 1,                     // éclair lumineux au changement
    boot: 0                       // séquence de démarrage 0 -> 1
  };

  function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }

  function pickGpu(gpus) {
    if (!gpus || !gpus.length) return null;
    for (var i = 0; i < gpus.length; i++) {
      if (gpus[i] && /RX|RTX|GTX|Arc/i.test(gpus[i].name || "")) return gpus[i];
    }
    return gpus[gpus.length - 1];
  }

  // Réception des données CAM (environ une fois par seconde)
  function onData(d) {
    if (!d) return;
    var c = d.cpus && d.cpus[0];
    var g = pickGpu(d.gpus);
    var k = d.kraken;
    if (c) {
      if (num(c.temperature) !== null) state.cpu = c.temperature;
      if (num(c.load) !== null) state.load = c.load > 1 ? c.load / 100 : c.load;
    }
    if (g && num(g.temperature) !== null) state.gpu = g.temperature;
    if (g && num(g.load) !== null) state.gpuLoad = g.load > 1 ? g.load / 100 : g.load;
    if (k && num(k.liquidTemperature) !== null) state.liq = k.liquidTemperature;
    state.live = true;
  }

  // On branche le récepteur sans effacer ce que CAM a mis dans window.nzxt.v1
  // (largeur, hauteur, fps…), et on le rebranche si CAM le remplace plus tard.
  function attach() {
    if (!window.nzxt || typeof window.nzxt !== "object") window.nzxt = {};
    if (!window.nzxt.v1 || typeof window.nzxt.v1 !== "object") window.nzxt.v1 = {};
    if (window.nzxt.v1.onMonitoringDataUpdate !== onData) window.nzxt.v1.onMonitoringDataUpdate = onData;
  }
  attach();
  setInterval(attach, 1000);
  window.addEventListener("load", attach);

  /* ---------- Canvas ---------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var S = 640, R = 320, cx = 320, cy = 320;

  function resize() {
    var v1 = window.nzxt.v1;
    var w = num(v1.width) || window.innerWidth;
    var h = num(v1.height) || window.innerHeight;
    S = Math.max(100, Math.min(w, h, window.innerWidth, window.innerHeight));
    var dpr = onKraken ? 1 : (window.devicePixelRatio || 1);
    canvas.width = Math.round(S * dpr);
    canvas.height = Math.round(S * dpr);
    canvas.style.width = S + "px";
    canvas.style.height = S + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = S / 2; cx = R; cy = R;
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- Outils ---------- */
  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function heatOf(temp) {
    var L = CONFIG.liquidScale;
    if (temp <= L[0][0]) return L[0][1];
    for (var i = 1; i < L.length; i++) {
      if (temp <= L[i][0]) return lerp(L[i - 1][1], L[i][1], (temp - L[i - 1][0]) / (L[i][0] - L[i - 1][0]));
    }
    return L[L.length - 1][1];
  }
  // Renvoie une "teinte" {h, w} : w = part de blanc glacier
  function hueOf(t) {
    var P = CONFIG.palette;
    t = clamp(t, 0, 1);
    for (var i = 1; i < P.length; i++) {
      if (t <= P[i][0]) {
        var u = (t - P[i - 1][0]) / (P[i][0] - P[i - 1][0]);
        return { h: lerp(P[i - 1][1], P[i][1], u), w: lerp(P[i - 1][2], P[i][2], u) };
      }
    }
    return { h: P[P.length - 1][1], w: P[P.length - 1][2] };
  }
  function easeOut(x) { return 1 - Math.pow(1 - clamp(x, 0, 1), 3); }
  function easeInOut(x) { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function hsla(h, s, l, a) {
    if (typeof h === "object") {
      // éclaircit les tons lumineux vers le blanc glacier, sans toucher au fond sombre
      l = l + (100 - l) * 0.52 * h.w * clamp((l - 15) / 40, 0, 1);
      h = h.h;
    }
    return "hsla(" + h.toFixed(1) + "," + s + "%," + l + "%," + a.toFixed(3) + ")"; }

  function sector(r1, r2, a1, a2) {
    ctx.beginPath();
    ctx.arc(cx, cy, r2, a1, a2);
    ctx.arc(cx, cy, r1, a2, a1, true);
    ctx.closePath();
  }

  var FONT = "Bahnschrift, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
  function text(str, x, y, size, weight, color, spacing) {
    ctx.font = weight + " " + size + "px " + FONT;
    if ("letterSpacing" in ctx) ctx.letterSpacing = (spacing || 0) + "px";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  }

  /* ---------- Animation ---------- */
  var t = 0, last = performance.now(), lastDraw = 0;
  var rotSeg = 0, rotDash = 0, wave = 0;
  // Tendance : moyenne rapide (~3 s) comparée à une moyenne lente (~15 s)
  var fast = { cpu: 0, gpu: 0, liq: 0, load: 0, gpuLoad: 0 };
  var slow = { cpu: 0, gpu: 0, liq: 0, load: 0, gpuLoad: 0 };
  var trendInit = false;
  var coreDir = 0, coreRot = 0;          // -1 descend, 0 stable, +1 monte (lissé)
  var sparks = [], sparkAcc = 0;
  var startTime = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);
    var fps = num(window.nzxt.v1.targetFps) || CONFIG.defaultFps;
    if (now - lastDraw < 1000 / fps - 2) return;
    lastDraw = now;

    // Temps réel écoulé (plafonné à 1 s seulement après une mise en veille),
    // pour que le cycle reste régulier même si l'écran rafraîchit de façon irrégulière.
    var dt = Math.min(1, Math.max(0, (now - last) / 1000));
    last = now;
    t += dt;

    // Mode démo si CAM n'envoie rien (aperçu dans un navigateur)
    if (!state.live && (!onKraken || now - startTime > 2000)) {
      state.load = 0.45 + 0.4 * Math.sin(t / 3.1) * Math.sin(t / 7.3);
      state.gpuLoad = 0.5 + 0.45 * Math.sin(t / 4.4 + 2);
      state.cpu = 52 + 22 * Math.sin(t / 4.2) + 4 * Math.sin(t * 1.3);
      state.gpu = 48 + 18 * Math.sin(t / 5.1 + 1);
      state.liq = 31 + 3 * Math.sin(t / 9);
    }

    var k = 1 - Math.exp(-dt * 2.5);
    disp.cpu += (state.cpu - disp.cpu) * k;
    disp.gpu += (state.gpu - disp.gpu) * k;
    disp.liq += (state.liq - disp.liq) * k;
    disp.load += (clamp(state.load, 0, 1) - disp.load) * k;
    disp.gpuLoad += (clamp(state.gpuLoad, 0, 1) - disp.gpuLoad) * k;

    var heat = heatOf(disp.liq);
    var hue = hueOf(heat);
    var load = disp.load;   // vitesse des anneaux = charge CPU (la charge GPU de la RX 9070 reste souvent haute)

    rotSeg   += dt * (0.12 + load * 1.1);
    rotDash  -= dt * (0.25 + load * 1.6);
    wave     += dt * (1.2 + load * 3.5);

    // Démarrage, rotation des valeurs, compteur, jauge
    anim.boot = Math.min(1, anim.boot + dt / 1.6);
    anim.since += dt;
    if (anim.since > CONFIG.cycleSeconds) {
      anim.prev = anim.idx;
      anim.idx = (anim.idx + 1) % METRICS.length;
      anim.since = 0;
      anim.burst = 1;
    }
    anim.burst = Math.max(0, anim.burst - dt * 1.4);
    var m = METRICS[anim.idx];
    var kc = 1 - Math.exp(-dt / 2.5);
    for (var key in calm) calm[key] += (state[key] - calm[key]) * kc;
    var target = Math.round(metricValue(m, calm));
    anim.shown += (target - anim.shown) * (1 - Math.exp(-dt * (anim.boot < 1 ? 2.2 : 7)));
    if (Math.abs(target - anim.shown) < 0.003) anim.shown = target;
    var gTarget = clamp((metricValue(m, calm) - m.min) / (m.max - m.min), 0, 1) * easeOut(anim.boot);
    anim.gauge += (gTarget - anim.gauge) * (1 - Math.exp(-dt * 3.5));

    // Tendance de la valeur affichée -> sens de rotation du cœur
    if (!trendInit) { for (var k0 in fast) { fast[k0] = slow[k0] = state[k0]; } trendInit = true; }
    var kf = 1 - Math.exp(-dt / 3), ks = 1 - Math.exp(-dt / 15);
    for (var k1 in fast) { fast[k1] += (state[k1] - fast[k1]) * kf; slow[k1] += (state[k1] - slow[k1]) * ks; }
    var tr = m.unit === "%" ? (fast[m.key] - slow[m.key]) * 100 : fast[m.key] - slow[m.key];
    var dirTarget = Math.tanh(tr / (m.trend || 1.5));
    coreDir += (dirTarget - coreDir) * (1 - Math.exp(-dt / 1.2));   // inversion douce : ralentit, s'arrête, repart
    coreRot += dt * coreDir * (0.9 + load * 1.2);

    // Étincelles
    if (CONFIG.sparks) {
      sparkAcc += dt * load * 35 * easeOut(anim.boot);
      while (sparkAcc >= 1 && sparks.length < 70) {
        sparkAcc -= 1;
        sparks.push({ a: Math.random() * TAU, r: 0.62, v: 0.18 + Math.random() * 0.25, life: 0, max: 0.6 + Math.random() * 0.7 });
      }
      if (sparkAcc > 1) sparkAcc = 0;
      for (var si = sparks.length - 1; si >= 0; si--) {
        var sp = sparks[si];
        sp.life += dt; sp.r += sp.v * dt; sp.a += coreDir * dt * 0.4;
        if (sp.life > sp.max || sp.r > 0.8) sparks.splice(si, 1);
      }
    }

    draw(hue, heat, load);
  }

  function draw(hue, heat, load) {
    ctx.save();
    ctx.clearRect(0, 0, S, S);
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.clip();

    // Fond
    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    bg.addColorStop(0, hsla(hue, 60, 3, 1));
    bg.addColorStop(0.55, hsla(hue, 50, 2.5, 1));
    bg.addColorStop(1, "#000");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, S, S);

    ctx.globalCompositeOperation = "lighter";

    // 1. Anneau de cellules en bord d'écran (vitesse = charge)
    var NS = 24, gap = 0.04;
    ctx.shadowColor = hsla(hue, 100, 60, 0.9);
    ctx.shadowBlur = R * 0.05;
    for (var j = 0; j < NS; j++) {
      var s1 = rotSeg + j * TAU / NS + gap / 2;
      var s2 = rotSeg + (j + 1) * TAU / NS - gap / 2;
      var w = 0.5 + 0.5 * Math.sin(wave - j * TAU / NS * 2);
      var b = 0.18 + 0.82 * Math.pow(w, 3);
      var reveal = clamp(anim.boot * (NS + 4) - j, 0, 1);
      if (reveal <= 0) continue;
      b = Math.min(1, b + anim.burst * 0.5);
      ctx.globalAlpha = reveal;
      sector(R * 0.815, R * 0.985, s1, s2);
      ctx.fillStyle = hsla(hue, 100, lerp(30, 66, b), 0.15 + 0.75 * b);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.strokeStyle = hsla(hue, 100, 70, 0.25);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.80, 0, TAU); ctx.stroke();

    // 2. Jauge de la valeur affichée (anneau intermédiaire)
    var rg = R * 0.715, gw = R * 0.05;
    var a0 = Math.PI * 0.75, sweep = Math.PI * 1.5;   // départ en bas à gauche, 270°
    var frac = anim.gauge;
    var bootA = easeOut(anim.boot);
    //   piste : tirets fins qui défilent lentement, ouverte en bas
    ctx.setLineDash([R * 0.012, R * 0.018]);
    ctx.lineDashOffset = -rotDash * R * 0.15;
    ctx.strokeStyle = hsla(hue, 90, 60, 0.16 * bootA);
    ctx.lineWidth = gw;
    ctx.beginPath(); ctx.arc(cx, cy, rg, a0, a0 + sweep); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
    //   fins liserés + petites butées aux extrémités
    ctx.strokeStyle = hsla(hue, 100, 70, 0.22 * bootA);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, rg + gw * 0.75, a0, a0 + sweep); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rg - gw * 0.75, a0, a0 + sweep); ctx.stroke();
    [a0, a0 + sweep].forEach(function (ea) {
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ea) * (rg - gw * 0.75), cy + Math.sin(ea) * (rg - gw * 0.75));
      ctx.lineTo(cx + Math.cos(ea) * (rg + gw * 0.75), cy + Math.sin(ea) * (rg + gw * 0.75));
      ctx.stroke();
    });
    //   arc allumé : même teinte que l'ensemble, du plus profond au plus lumineux
    if (frac > 0.002) {
      var aEnd = a0 + sweep * frac;
      var span = 0.75 * frac;                       // part du cercle couverte (pour le dégradé)
      var deep = { h: (hue.h - 14), w: hue.w * 0.4 }; // teinte décalée, plus saturée
      var gradOk = typeof ctx.createConicGradient === "function";
      function ring(l1, l2, alpha, width) {
        if (gradOk) {
          var cg = ctx.createConicGradient(a0, cx, cy);
          cg.addColorStop(0, hsla(deep, 100, l1, alpha * 0.8));
          cg.addColorStop(span * 0.55, hsla(hue, 100, (l1 + l2) / 2, alpha));
          cg.addColorStop(Math.max(span, 0.001), hsla(hue, 100, l2, alpha));
          if (span < 1) cg.addColorStop(Math.min(1, span + 0.001), hsla(hue, 100, l2, 0));
          ctx.strokeStyle = cg;
        } else {
          ctx.strokeStyle = hsla(hue, 100, l2, alpha);
        }
        ctx.lineWidth = width;
        ctx.beginPath(); ctx.arc(cx, cy, rg, a0, aEnd); ctx.stroke();
      }
      ring(45, 62, 0.18, gw * 2.2);   // halo
      ring(48, 76, 0.95, gw);         // trait
      //   tête lumineuse
      var hx = cx + Math.cos(aEnd) * rg, hy = cy + Math.sin(aEnd) * rg;
      ctx.shadowColor = hsla(hue, 100, 65, 1);
      ctx.shadowBlur = R * 0.06;
      ctx.fillStyle = hsla(hue, 100, 90, 1);
      ctx.beginPath(); ctx.arc(hx, hy, gw * (0.62 + 0.12 * Math.sin(t * 6)), 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 3. Cœur lumineux (pulsation = charge)
    var pulse = Math.min(1.6, 0.5 + 0.5 * Math.sin(t * (1.8 + load * 5)) + anim.burst * 0.8) * easeOut(anim.boot);
    var rc = R * (0.65 + 0.012 * pulse);
    var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, rc);
    core.addColorStop(0, hsla(hue, 100, 50, 0.04 + 0.03 * pulse));
    core.addColorStop(0.7, hsla(hue, 100, 50, 0.05 + 0.04 * pulse));
    core.addColorStop(0.93, hsla(hue, 100, 60, 0.22 + 0.14 * pulse));
    core.addColorStop(1, hsla(hue, 100, 60, 0));
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(cx, cy, rc, 0, TAU); ctx.fill();

    ctx.shadowColor = hsla(hue, 100, 65, 1);
    ctx.shadowBlur = R * 0.06;
    ctx.strokeStyle = hsla(hue, 100, 78, 0.85);
    ctx.lineWidth = Math.max(1.5, R * 0.01);
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.635, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;

    // 4. Rotation du cœur : sens horaire = monte, antihoraire = descend, quasi immobile = stable
    var rk = R * 0.595, bootC = easeOut(anim.boot);
    ctx.strokeStyle = hsla(hue, 100, 70, 0.14 * bootC);          // fines graduations qui tournent avec
    ctx.lineWidth = Math.max(1, R * 0.006);
    for (var gi = 0; gi < 72; gi++) {
      var ga = coreRot + gi * TAU / 72, gl = gi % 6 === 0 ? 0.03 : 0.015;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ga) * (rk - R * gl), cy + Math.sin(ga) * (rk - R * gl));
      ctx.lineTo(cx + Math.cos(ga) * (rk + R * gl), cy + Math.sin(ga) * (rk + R * gl));
      ctx.stroke();
    }
    var tail = 0.12 + 0.8 * Math.abs(coreDir), sgn = coreDir >= 0 ? 1 : -1;
    for (var ci = 0; ci < 3; ci++) {                                // 3 comètes : la traînée indique le sens
      var head = coreRot + ci * TAU / 3;
      for (var st = 0; st < 14; st++) {
        var f = st / 13;
        var aa = head - sgn * tail * f;
        ctx.fillStyle = hsla(hue, 100, lerp(92, 60, f), (1 - f) * 0.9 * bootC);
        ctx.beginPath();
        ctx.arc(cx + Math.cos(aa) * rk, cy + Math.sin(aa) * rk, Math.max(0.8, R * 0.014 * (1 - f * 0.8)), 0, TAU);
        ctx.fill();
      }
    }

    // 5. Étincelles
    for (var sj = 0; sj < sparks.length; sj++) {
      var spk = sparks[sj], fl = 1 - spk.life / spk.max;
      var x1 = cx + Math.cos(spk.a) * R * spk.r, y1 = cy + Math.sin(spk.a) * R * spk.r;
      var x2 = cx + Math.cos(spk.a) * R * (spk.r - 0.03), y2 = cy + Math.sin(spk.a) * R * (spk.r - 0.03);
      ctx.strokeStyle = hsla(hue, 100, 85, 0.8 * fl);
      ctx.lineWidth = Math.max(1, R * 0.007);
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x1, y1); ctx.stroke();
    }

    // 7. Affichage central animé
    drawCenter(hue);

    ctx.restore();
  }

  /* ---------- Affichage central ---------- */
  // Compteur à rouleaux : chaque chiffre défile verticalement
  function drawOdometer(v, x, y, size, color, glow) {
    v = Math.max(0, v);
    var n = Math.floor(v), f = v - n;
    var str = String(n);
    ctx.font = "300 " + size + "px " + FONT;
    var cw = ctx.measureText("0").width * 0.92;
    var h = size * 0.86;
    var total = cw * str.length;
    var x0 = x - total / 2;

    ctx.save();
    ctx.beginPath();
    ctx.rect(x0 - cw, y - h * 0.5, total + cw * 2, h * 1.0);
    ctx.clip();
    ctx.fillStyle = color;
    ctx.shadowColor = glow;
    ctx.shadowBlur = size * 0.12;
    var carry = f;                       // le rouleau des unités tourne avec la fraction
    for (var i = str.length - 1; i >= 0; i--) {
      var d = +str[i];
      var roll = easeInOut(carry);
      var dx = x0 + cw * (i + 0.5);
      var off = roll * h;
      ctx.globalAlpha = 1 - roll;
      ctx.fillText(String(d), dx, y - off);
      if (roll > 0.001) {
        ctx.globalAlpha = roll;
        ctx.fillText(String((d + 1) % 10), dx, y + h - off);
      }
      carry = d === 9 ? carry : 0;       // la dizaine ne tourne que si l'unité passe de 9 à 0
    }
    if (carry > 0.001) {                 // 9 -> 10, 99 -> 100 : le « 1 » de tête apparaît
      var rl = easeInOut(carry);
      ctx.globalAlpha = rl;
      ctx.fillText("1", x0 - cw * 0.5, y + h - rl * h);
    }
    ctx.restore();
    return total;
  }

  function drawCenter(hue) {
    var m = METRICS[anim.idx];
    var p = easeInOut(anim.since / 0.7);       // progression de la transition
    var boot = easeOut((anim.boot - 0.35) / 0.65);
    var light = hsla(hue, 80, 84, 0.9);
    var glow = hsla(hue, 100, 50, 0.9);

    ctx.globalCompositeOperation = "source-over";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // En haut : l'heure (les deux-points clignotent doucement)
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
    var ty = cy - R * 0.33, tsize = R * 0.105;
    ctx.shadowColor = glow; ctx.shadowBlur = R * 0.04;
    ctx.globalAlpha = boot;
    ctx.font = "400 " + tsize + "px " + FONT;
    var colonW = ctx.measureText(":").width;
    ctx.textAlign = "right";
    text(hh, cx - colonW * 0.7, ty, tsize, 400, light, R * 0.01);
    ctx.textAlign = "left";
    text(mm, cx + colonW * 0.7, ty, tsize, 400, light, R * 0.01);
    ctx.textAlign = "center";
    ctx.globalAlpha = boot * (0.35 + 0.65 * (0.5 + 0.5 * Math.cos(d.getMilliseconds() / 1000 * TAU)));
    text(":", cx, ty - tsize * 0.06, tsize, 400, light, 0);
    ctx.globalAlpha = 1;

    // Nombre : compteur à rouleaux
    var size = R * 0.5;
    var numY = cy + R * 0.02;
    ctx.globalAlpha = boot;
    var w = drawOdometer(anim.shown, cx - R * 0.04, numY, size, "#ffffff", glow);

    // Unité (° ou %) en fondu enchaîné
    var ux = cx - R * 0.04 + w / 2 + R * 0.1;
    var units = [{ u: m.unit, a: anim.prev >= 0 ? p : 1 }];
    if (anim.prev >= 0 && p < 1 && METRICS[anim.prev].unit !== m.unit) units.push({ u: METRICS[anim.prev].unit, a: 1 - p });
    else units[0].a = 1;
    for (var i = 0; i < units.length; i++) {
      var isDeg = units[i].u === "°";
      ctx.globalAlpha = units[i].a * boot;
      text(units[i].u, ux, isDeg ? numY - size * 0.24 : numY + size * 0.1,
           isDeg ? size * 0.4 : size * 0.26, 300, hsla(hue, 80, 85, 0.95), 0);
    }

    // En bas : le composant (fondu avec léger glissement)
    var ly = cy + R * 0.33, slide = R * 0.08;
    var pp = anim.prev >= 0 ? p : 1;
    ctx.shadowColor = glow; ctx.shadowBlur = R * 0.04;
    if (anim.prev >= 0 && p < 1) {
      ctx.globalAlpha = (1 - p) * boot;
      text(METRICS[anim.prev].label, cx, ly + slide * p * 0.6, R * 0.095, 500, light, R * 0.03);
    }
    ctx.globalAlpha = pp * boot;
    text(m.label, cx, ly + slide * 0.6 * (1 - pp), R * 0.095, 500, light, R * 0.03 * (2 - boot));
    ctx.globalAlpha = 1;

    // Indicateur : une pastille par valeur, l'active s'allonge
    var dotsY = cy + R * 0.455, gapD = R * 0.05, dot = R * 0.015;
    var widths = [], sum = 0;
    for (var k = 0; k < METRICS.length; k++) {
      var act = k === anim.idx ? (anim.prev >= 0 ? p : 1) : (k === anim.prev ? 1 - p : 0);
      widths.push({ w: dot * 2 + act * R * 0.045, a: act });
      sum += widths[k].w;
    }
    var dxp = cx - (sum + gapD * (METRICS.length - 1)) / 2;
    ctx.shadowBlur = R * 0.03;
    for (k = 0; k < METRICS.length; k++) {
      ctx.globalAlpha = boot;
      ctx.fillStyle = hsla(hue, 100, lerp(45, 80, widths[k].a), 0.35 + 0.65 * widths[k].a);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(dxp, dotsY - dot, widths[k].w, dot * 2, dot);
      else ctx.rect(dxp, dotsY - dot, widths[k].w, dot * 2);
      ctx.fill();
      dxp += widths[k].w + gapD;
    }

    if (!state.live) {
      ctx.globalAlpha = 0.35 * boot;
      text("DÉMO", cx, cy - R * 0.47, R * 0.04, 600, "#ffffff", R * 0.02);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
